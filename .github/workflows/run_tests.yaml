name: Run tests

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      runs-on:
        required: true
        type: string

jobs:
  run_test:
    runs-on: ${{ inputs.runs-on }}
    defaults: {run: {shell: bash}} # Use bash even on windows for consistency.
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.6"

    - name: Install package
      run: |
        which python
        python --version
        uv sync --locked --no-editable --extra sympy --group tests
        uv run python -c "import parsnip, pytest, gemmi; print('parsnip', parsnip.__version__)"

    - name: Test with pytest
      run: uv run --frozen ${{ runner.os != 'Windows' && 'pytest' || 'pytest tests' }} -v -n auto
